## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=5.5.0,<5.6.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/esp_websocket_client: ^1.4.0
  # mDNS client — runtime discovery of the companion backend ("_espet._tcp")
  espressif/mdns: "*"
  # SSD1306 OLED — text status display (driver in display/display_status.c)
  espressif/ssd1306: "*"
  espressif/esp32-camera: "*"
  # WakeWord engine (WakeNet) — on-device "Hi ESP" detection for the voice flow
  espressif/esp-sr: "^2.0.0"
