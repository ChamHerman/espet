<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ESPET Control Center</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/app/index.css?v=cloudnav5">
  <link rel="icon" type="image/jpeg" href="/static/brand/espet_logo.jpg">
  <style>
    /* Pre-hydration background so there is no white flash before the app paints. */
    html { background: #050505; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      font-family: "Outfit", system-ui, sans-serif; color: #737373;
      font-size: 14px; letter-spacing: .3px;
    }
    #boot .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    #boot .boot-logo {
      width: 128px; height: 128px; border-radius: 30px; object-fit: cover;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 40px rgba(255,255,255,0.18), 0 0 80px rgba(255,255,255,0.08);
      animation: bootPulse 2.4s ease-in-out infinite;
    }
    @keyframes bootPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,255,255,0.18), 0 0 80px rgba(255,255,255,0.08); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,255,255,0.28), 0 0 110px rgba(255,255,255,0.12); }
    }
    @media (prefers-reduced-motion: reduce) { #boot .boot-logo { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">
    <div class="boot-inner">
      <img class="boot-logo" src="/static/brand/espet_logo.jpg" alt="ESPET">
      <div>Starting ESPET Control Center…</div>
    </div>
  </div>

  <!-- 3D companion viewer (framework-agnostic global consumed by <ToyAvatar>) -->
  <script src="/static/vendor/toy.bundle.js?v=2"></script>
  <!-- React SPA (esbuild output; chunks lazy-loaded from /static/vendor/app/chunks) -->
  <script type="module" src="/static/vendor/app/index.js?v=cloudnav5"></script>
  <script>
    // Remove the boot splash once the app has mounted its root children.
    var root = document.getElementById('root');
    if (root) {
      new MutationObserver(function (_, obs) {
        if (root.childElementCount) { document.getElementById('boot')?.remove(); obs.disconnect(); }
      }).observe(root, { childList: true });
    }
  </script>
</body>
</html>
