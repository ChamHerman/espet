<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="holes" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#cbd5e1"/>
    </pattern>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">ESPET pan/tilt wiring — 2× SG90 servos on GPIO 14 &amp; 48</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#64748b">The new breadboard carries the servo power rails; two signal jumpers go back to the main ESP32-S3</text>

  <!-- ================= main breadboard ================= -->
  <rect x="40" y="80" width="300" height="490" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="56" y="104" font-size="13" font-weight="600" fill="#047857">main breadboard (existing)</text>

  <!-- ESP32 module -->
  <rect x="110" y="160" width="160" height="330" rx="10" fill="#1e293b" stroke="#0f172a"/>
  <text x="190" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">ESP32-S3</text>
  <text x="190" y="204" text-anchor="middle" font-size="11" fill="#94a3b8">N16R8 · MimiClaw</text>
  <text x="190" y="512" text-anchor="middle" font-size="11" fill="#475569">existing wiring unchanged</text>

  <!-- pin stubs -->
  <rect x="270" y="210" width="18" height="14" rx="2" fill="#f59e0b"/>
  <text x="262" y="221" text-anchor="end" font-size="12" font-weight="600" fill="#ffffff">GPIO 14</text>

  <rect x="270" y="260" width="18" height="14" rx="2" fill="#f59e0b"/>
  <text x="262" y="271" text-anchor="end" font-size="12" font-weight="600" fill="#ffffff">GPIO 48</text>

  <rect x="270" y="310" width="18" height="14" rx="2" fill="#94a3b8"/>
  <text x="262" y="321" text-anchor="end" font-size="12" font-weight="600" fill="#ffffff">GND</text>

  <rect x="270" y="360" width="18" height="14" rx="2" fill="#dc2626"/>
  <text x="262" y="371" text-anchor="end" font-size="12" font-weight="600" fill="#ffffff">5V</text>
  <line x1="271" y1="361" x2="287" y2="373" stroke="#7f1d1d" stroke-width="3"/>
  <line x1="287" y1="361" x2="271" y2="373" stroke="#7f1d1d" stroke-width="3"/>
  <text x="262" y="396" text-anchor="end" font-size="10" font-weight="600" fill="#fca5a5">not for servos</text>

  <!-- signal labels -->
  <text x="350" y="182" font-size="12" font-weight="600" fill="#b45309">orange = signal jumper</text>
  <text x="350" y="202" font-size="12" fill="#b45309">GPIO 14 → PAN · GPIO 48 → TILT</text>

  <!-- ================= signal wires ================= -->
  <path d="M288,217 C400,217 500,237 610,237" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M288,267 C460,315 640,315 790,237" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- common ground wire -->
  <path d="M575,382 C480,382 320,360 288,320" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="360" y="404" font-size="12" font-weight="700" fill="#334155">COMMON GND (mandatory)</text>

  <!-- ================= second breadboard ================= -->
  <rect x="560" y="90" width="360" height="330" rx="12" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="575" y="120" font-size="13" font-weight="600" fill="#1d4ed8">second breadboard (new) — carries servo power rails</text>
  <rect x="575" y="150" width="330" height="215" fill="url(#holes)"/>

  <!-- +5V rail -->
  <rect x="575" y="135" width="330" height="6" fill="#dc2626"/>
  <text x="915" y="143" font-size="11" font-weight="700" fill="#b91c1c">+5V</text>

  <!-- GND rail -->
  <rect x="575" y="379" width="330" height="6" fill="#111827"/>
  <text x="915" y="387" font-size="11" font-weight="700" fill="#334155">GND</text>

  <!-- power feeds -->
  <rect x="589" y="458" width="12" height="12" fill="#dc2626"/>
  <path d="M595,458 L595,141" stroke="#dc2626" stroke-width="4"/>
  <rect x="854" y="458" width="12" height="12" fill="#111827"/>
  <path d="M860,458 L860,385" stroke="#111827" stroke-width="4"/>

  <!-- VCC stubs from +5V rail down to servo VCC pins -->
  <line x1="647" y1="141" x2="647" y2="230" stroke="#dc2626" stroke-width="3"/>
  <line x1="827" y1="141" x2="827" y2="230" stroke="#dc2626" stroke-width="3"/>

  <!-- GND stubs from servo GND pins down to GND rail -->
  <line x1="677" y1="244" x2="677" y2="379" stroke="#111827" stroke-width="3"/>
  <line x1="857" y1="244" x2="857" y2="379" stroke="#111827" stroke-width="3"/>

  <!-- PAN servo header -->
  <text x="647" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" paint-order="stroke" stroke="#f8fafc" stroke-width="4">PAN · SG90 (left/right)</text>
  <rect x="610" y="230" width="14" height="14" fill="#f59e0b"/>
  <rect x="640" y="230" width="14" height="14" fill="#dc2626"/>
  <rect x="670" y="230" width="14" height="14" fill="#111827"/>

  <!-- TILT servo header -->
  <text x="827" y="207" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" paint-order="stroke" stroke="#f8fafc" stroke-width="4">TILT · SG90 (up/down)</text>
  <rect x="790" y="230" width="14" height="14" fill="#f59e0b"/>
  <rect x="820" y="230" width="14" height="14" fill="#dc2626"/>
  <rect x="850" y="230" width="14" height="14" fill="#111827"/>

  <text x="725" y="440" text-anchor="middle" font-size="11" fill="#475569">orange = SIG · red = VCC · brown = GND</text>

  <!-- ================= battery ================= -->
  <rect x="560" y="470" width="360" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">External 5V supply</text>
  <text x="740" y="522" text-anchor="middle" font-size="11" fill="#9a3412">4×AA pack · or 5V 2A adapter + UBEC</text>
  <text x="740" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">NEVER power servos from the ESP32 5V pin</text>
  <text x="608" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">+</text>
  <text x="872" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">−</text>

  <!-- ================= notes ================= -->
  <text x="60" y="600" font-size="13" fill="#334155">① Servo power ONLY from the external 5V supply — never the ESP32 5V pin (brownouts will reset the board)</text>
  <text x="60" y="622" font-size="13" fill="#334155">② Common ground is mandatory: battery − = breadboard GND rail = ESP32 GND    ③ Optional 470–1000 µF capacitor across the rails</text>
  <text x="60" y="644" font-size="13" fill="#334155">④ Servo wires: orange = signal · red = VCC · brown = GND    ⑤ GPIO 48 also drives the onboard RGB LED (flickers — harmless)</text>
</svg>
