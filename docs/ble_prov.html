<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPET - Web Bluetooth Wi-Fi Provisioning</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(255, 255, 255, 0.055);
      --card-border: rgba(255, 255, 255, 0.10);
      --card-inner: rgba(255, 255, 255, 0.035);
      --text: #f5f5f5;
      --text-muted: #a3a3a3;
      --text-dim: #737373;
      --accent: #93c5fd;
      --mint: #8fd9ae;
      --mint-bg: rgba(143, 217, 174, 0.10);
      --mint-border: rgba(143, 217, 174, 0.28);
      --red: #eda7a7;
      --red-bg: rgba(237, 167, 167, 0.10);
      --red-border: rgba(237, 167, 167, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: rgba(147, 197, 253, 0.35); color: #f0f7ff; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .pw-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .pw-wrap input {
      margin-bottom: 0;
      padding-right: 44px;
    }
    .pw-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 42px;
      height: 100%;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 0 12px 12px 0;
      background: transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s;
    }
    .pw-toggle:hover {
      background: transparent;
      color: var(--text-muted);
    }
    .badge-neutral {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
    }
    p.desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .step {
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card-inner);
    }
    .step-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #000;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(120deg, rgba(96, 165, 250, 0.22), rgba(147, 197, 253, 0.14));
      border: 1px solid rgba(147, 197, 253, 0.35);
      color: #dbeafe;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background: linear-gradient(120deg, rgba(96, 165, 250, 0.32), rgba(147, 197, 253, 0.22));
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-weight: 500;
      margin-top: 8px;
    }
    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.06);
    }
    #log {
      margin-top: 16px;
      background: #000;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      height: 140px;
      overflow-y: auto;
      color: var(--text-dim);
    }
    .log-line { margin-bottom: 4px; color: var(--text-dim); }
    .log-info { color: var(--text-muted); }
    .log-success { color: var(--mint); }
    .log-error { color: var(--red); }
  </style>
</head>
<body>
  <div class="card">
    <h1>ESPET BLE Provisioning</h1>
    <div class="badge-neutral">No Mobile App Required</div>
    <p class="desc">
      Configure your phone's Personal Hotspot or home Wi-Fi over Bluetooth Low Energy.
      Your hotspot stays active throughout the entire setup.
    </p>

    <!-- Step 1: Discover device -->
    <div class="step" id="step-connect">
      <div class="step-title">1. Connect ESPET Device</div>
      <button id="btn-search">Search & Pair ESPET (BLE)</button>
    </div>

    <!-- Step 2: Configure Wi-Fi -->
    <div class="step" id="step-wifi" style="opacity: 0.5; pointer-events: none;">
      <div class="step-title">2. Select & Enter Wi-Fi Details</div>
      <input type="text" id="ssid" placeholder="Wi-Fi SSID (e.g. My Phone Hotspot)">
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Wi-Fi Password">
        <button type="button" class="pw-toggle" id="btn-toggle-pw" aria-label="Show password" aria-pressed="false">
          <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
            <line class="icon-eye-slash" x1="4" y1="4" x2="20" y2="20" style="display: none;"/>
          </svg>
        </button>
      </div>
      <input type="text" id="backend-url" placeholder="Backend Server URL (optional, e.g. http://172.20.10.2:8000)" autocomplete="off" spellcheck="false">
      <button id="btn-provision">Connect Wi-Fi</button>
      <button class="btn-secondary" id="btn-scan">Scan 2.4 GHz Networks</button>
      <div id="scan-results" style="margin-top: 8px;"></div>
    </div>

    <!-- Live Event Log -->
    <div class="step-title" style="margin-top: 12px;">Activity Log</div>
    <div id="log"></div>
  </div>

  <script type="module">
    import {
      ESPProvisionManager,
      ESPWifiStaState,
      FALLBACK_SERVICE_UUID
    } from 'https://unpkg.com/esp-idf-provisioning-web@0.0.7/dist/index.es.js';

    let provDevice = null;

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      const time = new Date().toLocaleTimeString();
      line.textContent = `[${time}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    if (!ESPProvisionManager.isBluetoothSupported()) {
      log('Web Bluetooth is not supported in this browser. Use Chrome/Edge on Android/PC/Mac or Bluefy on iOS.', 'error');
      document.getElementById('btn-search').disabled = true;
    } else {
      log('Web Bluetooth ready. Tap "Search & Pair ESPET" to begin.', 'success');
    }

    document.getElementById('btn-search').addEventListener('click', async () => {
      log('Scanning for PROV_ESPET devices over BLE...', 'info');
      try {
        provDevice = await ESPProvisionManager.searchBLEDevice({
          filters: [
            { namePrefix: 'PROV_ESPET_' },
            { namePrefix: 'PROV_' },
            { services: [FALLBACK_SERVICE_UUID] }
          ],
          optionalServices: [FALLBACK_SERVICE_UUID]
        });

        if (!provDevice) {
          log('No device selected.', 'error');
          return;
        }

        const devName = provDevice.getDevice().name || 'PROV_ESPET';
        log(`Connecting to ${devName}...`, 'info');
        await provDevice.connect();
        log(`Connected to ${devName}!`, 'success');

        document.getElementById('step-wifi').style.opacity = '1';
        document.getElementById('step-wifi').style.pointerEvents = 'auto';
        document.getElementById('btn-search').textContent = `Connected: ${devName}`;
        document.getElementById('btn-search').disabled = true;
      } catch (err) {
        log(`Pairing error: ${err.message}`, 'error');
      }
    });

    document.getElementById('btn-scan').addEventListener('click', async () => {
      if (!provDevice) return;
      log('Requesting ESPET to scan 2.4 GHz Wi-Fi channels...', 'info');
      try {
        const networks = await provDevice.scanWifiList();
        const resultsEl = document.getElementById('scan-results');
        resultsEl.innerHTML = '';
        if (networks && networks.length > 0) {
          log(`Discovered ${networks.length} networks`, 'success');
          const select = document.createElement('select');
          select.innerHTML = '<option value="">-- Tap to select detected network --</option>' +
            networks.map(n => `<option value="${n.ssid}">${n.ssid} (${n.rssi} dBm)</option>`).join('');
          select.addEventListener('change', (e) => {
            if (e.target.value) {
              document.getElementById('ssid').value = e.target.value;
            }
          });
          resultsEl.appendChild(select);
        } else {
          log('No networks found via scan. You can enter SSID manually.', 'info');
        }
      } catch (err) {
        log(`Scan failed: ${err.message}`, 'error');
      }
    });

    const passwordInput = document.getElementById('password');
    const pwToggle = document.getElementById('btn-toggle-pw');
    pwToggle.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      pwToggle.querySelector('.icon-eye-slash').style.display = show ? '' : 'none';
      pwToggle.setAttribute('aria-pressed', String(show));
      pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    document.getElementById('btn-provision').addEventListener('click', async () => {
      if (!provDevice) return;
      const ssid = document.getElementById('ssid').value.trim();
      const password = document.getElementById('password').value;

      if (!ssid) {
        log('Please enter Wi-Fi SSID', 'error');
        return;
      }

      const rawBackendUrl = document.getElementById('backend-url').value.trim();
      let backendUrl = '';
      if (rawBackendUrl) {
        backendUrl = rawBackendUrl.replace(/\/+$/, '');
        if (!backendUrl.startsWith('http://') && !backendUrl.startsWith('https://')) {
          backendUrl = 'http://' + backendUrl;
        }
        try {
          const parsed = new URL(backendUrl);
          const host = parsed.hostname.toLowerCase().replace(/^\[|\]$/g, '');
          if (host === 'localhost' || host.endsWith('.localhost') ||
              host.startsWith('127.') || host === '::1' || host === '0.0.0.0') {
            log('Backend URL cannot be localhost/127.0.0.1 (that points to the ESP32 itself). Enter your PC LAN IP (e.g. http://192.168.0.34:8000) or leave blank for auto-discovery.', 'error');
            return;
          }
        } catch (e) {
          log(`Invalid Backend URL: ${rawBackendUrl}`, 'error');
          return;
        }
      }

      document.getElementById('btn-provision').disabled = true;

      try {
        if (backendUrl) {
          log(`Sending backend URL to ESPET: ${backendUrl}...`, 'info');
          try {
            const payload = JSON.stringify({ backend_url: backendUrl });
            await provDevice.sendData('custom-config', new TextEncoder().encode(payload));
            log('Backend URL saved to ESPET!', 'success');
          } catch (e) {
            log(`Notice: Could not send custom config (${e.message}). Proceeding with Wi-Fi...`, 'info');
          }
        }

        log(`Sending credentials for "${ssid}" to ESPET...`, 'info');
        await provDevice.provision(ssid, password);
        log('Credentials delivered. ESPET testing connection...', 'info');

        let status;
        let pollCount = 0;
        do {
          await new Promise(r => setTimeout(r, 2000));
          status = await provDevice.fetchWifiStatus();
          pollCount++;
          log(`Connection state: ${status.staState}`, 'info');
        } while (status.staState === ESPWifiStaState.connecting && pollCount < 15);

        if (status.staState === ESPWifiStaState.connected) {
          log('WiFi connected successfully! ESPET saving credentials to NVS and rebooting...', 'success');
          document.getElementById('btn-provision').textContent = 'Provisioned & Connected!';
        } else if (status.staState === ESPWifiStaState.failed) {
          log(`Failed to connect: ${status.failedReason || 'Auth/timeout error'}`, 'error');
          document.getElementById('btn-provision').disabled = false;
        } else {
          log('Provisioning request accepted. Device restarting.', 'success');
        }
      } catch (err) {
        log(`Provisioning error: ${err.message}`, 'error');
        document.getElementById('btn-provision').disabled = false;
      }
    });
  </script>
</body>
</html>
